<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("monthly-budget-theme");
        if (t !== "light" && t !== "dark") t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        var bg = t === "light" ? "#F4F4F2" : "#0E1410";
        document.documentElement.setAttribute("data-theme", t);
        document.documentElement.style.backgroundColor = bg;
        document.documentElement.style.colorScheme = t;
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", bg);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
        document.documentElement.style.backgroundColor = "#0E1410";
      }
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=login.html" />
  <title>Monthly Budget</title>
  <link rel="icon" href="favicon.svg?v=22" type="image/svg+xml" />
  <script defer src="config.js"></script>
  <script defer src="vendor/supabase.min.js"></script>
  <script>
    (async function () {
      try {
        if (window.SUPABASE_URL && window.SUPABASE_ANON_KEY && window.supabase) {
          var sb = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
          var res = await sb.auth.getSession();
          location.replace(res.data && res.data.session ? "dashboard.html" : "login.html");
          return;
        }
      } catch (e) {}
      location.replace("login.html");
    })();
  </script>
</head>
<body>
  <p style="font-family:system-ui;padding:2rem">Opening Monthly Budget…</p>
</body>
</html>
