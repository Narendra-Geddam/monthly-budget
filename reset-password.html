<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Set a new Monthly Budget password." />
  <meta name="theme-color" content="#10150C" />
  <meta name="color-scheme" content="dark light" />
  <title>Reset password · Monthly Budget</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.json?v=20" />
  <link rel="preconnect" href="https://kjnzcetsidsvnrtybicl.supabase.co" crossorigin />
  <link rel="dns-prefetch" href="https://kjnzcetsidsvnrtybicl.supabase.co" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("monthly-budget-theme");
        if (t !== "light" && t !== "dark") t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", t);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", t === "light" ? "#F4F4F2" : "#10150C");
      } catch (e) { document.documentElement.setAttribute("data-theme", "dark"); }
    })();
  </script>
</head>
<body class="auth-body">
  <main class="auth-card">
    <div class="auth-brand">
      <img src="favicon.svg" alt="" width="40" height="40" />
      <div>
        <p class="brand-kicker">Roommate expenses</p>
        <h1>Set a new password</h1>
      </div>
    </div>
    <p class="auth-lead" id="reset-lead">Choose a new password for your account. Use at least 8 characters.</p>
    <p class="form-error" id="config-warning" hidden></p>
    <form id="reset-form">
      <label class="field"><span>New password</span><input type="password" id="auth-password" required minlength="8" autocomplete="new-password" /></label>
      <p class="pw-hint" id="pw-hint">Use at least 8 characters.</p>
      <label class="field"><span>Confirm password</span><input type="password" id="auth-confirm" required minlength="8" autocomplete="new-password" /></label>
      <p class="pw-match" id="pw-match" hidden></p>
      <p class="form-error" id="auth-error" hidden></p>
      <p class="form-ok" id="auth-ok" hidden></p>
      <button type="submit" class="primary-btn auth-submit" id="auth-submit">Update password</button>
    </form>
    <p class="auth-switch"><a href="login.html">Back to log in</a></p>
  </main>
  <script defer src="config.js"></script>
  <script defer src="vendor/supabase.min.js"></script>
  <script defer src="js/common.js"></script>
  <script defer src="js/reset-password.js"></script>
</body>
</html>
