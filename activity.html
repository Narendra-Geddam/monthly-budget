<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="A live feed of expenses, payments, and room updates." />
  <meta name="theme-color" content="#0E1410" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("monthly-budget-theme");
        if (t !== "light" && t !== "dark") t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        var bg = t === "light" ? "#F4F4F2" : "#0E1410";
        document.documentElement.setAttribute("data-theme", t);
        document.documentElement.style.backgroundColor = bg;
        document.documentElement.style.colorScheme = t;
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", bg);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
        document.documentElement.style.backgroundColor = "#0E1410";
      }
    })();
  </script>
  <meta name="color-scheme" content="dark light" />
  <title>Activity · Monthly Budget</title>
  <link rel="icon" href="favicon.svg?v=22" type="image/svg+xml" />
  <link rel="manifest" href="manifest.json?v=33" />
  <link rel="preconnect" href="https://kjnzcetsidsvnrtybicl.supabase.co" crossorigin />
  <link rel="dns-prefetch" href="https://kjnzcetsidsvnrtybicl.supabase.co" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header id="topbar" class="topbar"></header>
  <main class="page" id="main">
    <section class="card is-outline activity-card">
      <header class="card-head activity-head">
        <div>
          <div class="activity-title-row">
            <h2>Activity</h2>
            <a class="activity-expenses-link" href="expenses.html">Expenses</a>
          </div>
          <p class="card-sub">Newest first, like a payment feed.</p>
        </div>
      </header>
      <div class="activity-filters">
        <label class="field">
          <span>Room</span>
          <select id="scope-filter" class="select pill-select" aria-label="Room"></select>
        </label>
        <label class="field">
          <span>Type</span>
          <select id="kind-filter" class="select pill-select" aria-label="Type"></select>
        </label>
      </div>
    </section>
    <div id="activity-feed" class="activity-feed"></div>
    <div id="activity-more-wrap" class="activity-more-wrap" hidden>
      <button type="button" class="secondary-btn" id="activity-more">Load more</button>
    </div>
  </main>
  <nav id="bottom-nav" class="bottom-nav"></nav>
  <script defer src="config.js"></script>
  <script defer src="vendor/supabase.min.js"></script>
  <script defer src="js/common.js"></script>
  <script defer src="js/activity.js"></script>
</body>
</html>
