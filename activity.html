<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="A live feed of expenses, payments, and room updates." />
  <meta name="theme-color" content="#131512" />
  <meta name="color-scheme" content="dark light" />
  <title>Activity · Monthly Budget</title>
  <link rel="icon" href="favicon.svg?v=22" type="image/svg+xml" />
  <link rel="manifest" href="manifest.json?v=24" />
  <link rel="preconnect" href="https://kjnzcetsidsvnrtybicl.supabase.co" crossorigin />
  <link rel="dns-prefetch" href="https://kjnzcetsidsvnrtybicl.supabase.co" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("monthly-budget-theme");
        if (t !== "light" && t !== "dark") t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", t);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", t === "light" ? "#F4F4F2" : "#131512");
      } catch (e) { document.documentElement.setAttribute("data-theme", "dark"); }
    })();
  </script>
</head>
<body>
  <header id="topbar" class="topbar"></header>
  <main class="page" id="main">
    <section class="card">
      <header class="card-head">
        <div>
          <h2>Activity</h2>
          <p class="card-sub">Everything happening in your rooms, newest first — like a payment feed.</p>
        </div>
        <a href="expenses.html">All expenses</a>
      </header>
      <div class="chip-row scope-chips" id="scope-chips" role="tablist" aria-label="Filter by room"></div>
      <div class="chip-row kind-chips" id="kind-chips" role="tablist" aria-label="Filter by type"></div>
    </section>
    <div id="activity-feed" class="activity-feed"></div>
    <div id="activity-more-wrap" class="activity-more-wrap" hidden>
      <button type="button" class="secondary-btn" id="activity-more">Load more</button>
    </div>
  </main>
  <nav id="bottom-nav" class="bottom-nav"></nav>
  <script defer src="config.js"></script>
  <script defer src="vendor/supabase.min.js"></script>
  <script defer src="js/common.js"></script>
  <script defer src="js/activity.js"></script>
</body>
</html>
