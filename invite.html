<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="You're invited to join a roommate budget room on Monthly Budget." />
  <meta name="theme-color" content="#0E1410" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("monthly-budget-theme");
        if (t !== "light" && t !== "dark") t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        var bg = t === "light" ? "#F4F4F2" : "#0E1410";
        document.documentElement.setAttribute("data-theme", t);
        document.documentElement.style.backgroundColor = bg;
        document.documentElement.style.colorScheme = t;
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", bg);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
        document.documentElement.style.backgroundColor = "#0E1410";
      }
    })();
  </script>
  <meta name="color-scheme" content="dark light" />
  <title>You're invited · Monthly Budget</title>
  <link rel="icon" href="favicon.svg?v=22" type="image/svg+xml" />
  <link rel="manifest" href="manifest.json?v=32" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=22" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Monthly Budget" />
  <meta property="og:title" content="You're invited to join a room on Monthly Budget" />

  <meta name="twitter:title" content="You're invited to join a room on Monthly Budget" />
  <meta name="twitter:description" content="Tap to see the room and join your roommates. Shared expenses, settled fairly." />
  <meta name="twitter:image" content="icons/og.png?v=22" />
  <script>
    (function () {
      try {
        var origin = location.origin;
        var path = location.pathname || "";
        var dir = path.slice(0, path.lastIndexOf("/") + 1) || "/";
        var url = origin + path + location.search;
        var img = origin + dir + "icons/og.png?v=22";
        var ogImg = document.querySelector('meta[property="og:image"]');
        var twImg = document.querySelector('meta[name="twitter:image"]');
        var ogUrl = document.querySelector('meta[property="og:url"]');
        if (ogImg) ogImg.setAttribute("content", img);
        if (twImg) twImg.setAttribute("content", img);
        if (ogUrl) ogUrl.setAttribute("content", url);
      } catch (e) { /* ignore */ }
    })();
  </script>

<body>
  <header id="topbar" class="topbar"></header>
  <main class="page" id="main">
    <section class="card invite-hero" id="invite-card">
      <p class="brand-kicker">Monthly Budget</p>
      <h2 id="invite-title">Join a room</h2>
      <p class="card-sub" id="invite-lead">Use an invite code from a roommate to join their room. If the room requires approval, a roommate will review your request.</p>
      <dl class="invite-meta" id="invite-meta" hidden></dl>
      <p id="invite-status" class="notice" hidden></p>
      <div class="btn-row" id="invite-auth" hidden>
        <a class="primary-btn" id="invite-login">Log in</a>
        <a class="secondary-btn" id="invite-signup">Sign up</a>
      </div>
      <form id="join-form" hidden>
        <label class="field" id="join-code-field"><span>Invite code</span><input type="text" id="join-code" maxlength="6" placeholder="ABC123" autocapitalize="characters" required /></label>
        <button type="submit" class="primary-btn" id="join-btn">Join</button>
      </form>
      <p class="form-error" id="join-error" hidden></p>
    </section>
  </main>
