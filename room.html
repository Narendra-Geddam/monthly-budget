<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Shared roommate expenses for your bachelor room." />
  <meta name="theme-color" content="#1C1917" />
  <meta name="color-scheme" content="dark light" />
  <title>Room · Monthly Budget</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://kjnzcetsidsvnrtybicl.supabase.co" crossorigin />
  <link rel="dns-prefetch" href="https://kjnzcetsidsvnrtybicl.supabase.co" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,640&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("monthly-budget-theme");
        if (t !== "light" && t !== "dark") t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", t);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", t === "light" ? "#FFF7ED" : "#1C1917");
      } catch (e) { document.documentElement.setAttribute("data-theme", "dark"); }
    })();
  </script>
</head>
<body>
  <header id="topbar" class="topbar"></header>
  <main class="page" id="main">

    <section class="card" id="current-room">
      <p class="brand-kicker">Current room</p>
      <h2 id="room-name">Room</h2>
      <p class="card-sub" style="margin:12px 0 8px">Invite code</p>
      <div class="code-box"><span id="room-code"></span><button type="button" class="text-btn" id="copy-code">Copy</button></div>
      <div class="btn-row" style="margin-top:12px">
        <a class="secondary-btn" id="share-wa" target="_blank" rel="noopener">Share on WhatsApp</a>
        <button type="button" class="secondary-btn" id="share-native" hidden>Share</button>
        <button type="button" class="secondary-btn" id="copy-msg">Copy message</button>
        <button type="button" class="danger-btn ghost" id="leave-room">Leave room</button>
      </div>
      <header class="card-head" style="margin-top:20px"><h3>Members</h3></header>
      <div class="list" id="member-list"></div>
    </section>
    <section class="card">
      <h3>Switch room</h3>
      <form id="switch-form" style="margin-top:12px">
        <label class="field"><span>Your rooms</span><select id="room-switch" class="select"></select></label>
        <button type="submit" class="secondary-btn">Switch</button>
      </form>
    </section>
    <section class="card">
      <h3>Create or join another room</h3>
      <form id="create-form" style="margin-top:12px">
        <label class="field"><span>New room name</span><input type="text" id="new-room-name" maxlength="80" placeholder="Room name" required /></label>
        <button type="submit" class="primary-btn">Create room</button>
      </form>
      <form id="join-form" style="margin-top:16px">
        <label class="field"><span>Invite code</span><input type="text" id="join-code" maxlength="6" placeholder="ABC123" autocapitalize="characters" /></label>
        <button type="submit" class="secondary-btn">Join room</button>
      </form>
      <p class="form-error" id="room-error" hidden></p>
    </section>
  </main>
  <nav id="bottom-nav" class="bottom-nav"></nav>
  <script defer src="config.js"></script>
  <script defer src="vendor/supabase.min.js"></script>
  
  <script defer src="js/common.js"></script>
  <script defer src="js/room.js"></script>
</body>
</html>
