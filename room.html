<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Shared roommate expenses for your bachelor room." />
  <meta name="theme-color" content="#0E1410" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("monthly-budget-theme");
        if (t !== "light" && t !== "dark") t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        var bg = t === "light" ? "#F4F4F2" : "#0E1410";
        document.documentElement.setAttribute("data-theme", t);
        document.documentElement.style.backgroundColor = bg;
        document.documentElement.style.colorScheme = t;
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", bg);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
        document.documentElement.style.backgroundColor = "#0E1410";
      }
    })();
  </script>
  <meta name="color-scheme" content="dark light" />
  <title>Room · Monthly Budget</title>
  <link rel="icon" href="favicon.svg?v=22" type="image/svg+xml" />
  <link rel="manifest" href="manifest.json?v=38" />
  <link rel="preconnect" href="https://kjnzcetsidsvnrtybicl.supabase.co" crossorigin />
  <link rel="dns-prefetch" href="https://kjnzcetsidsvnrtybicl.supabase.co" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header id="topbar" class="topbar"></header>
  <main class="page" id="main">

    <section id="current-room" class="room-page" hidden>
      <header class="page-heading">
        <h1 class="page-title" id="room-heading">Room</h1>
      </header>

      <section class="card invite-card" aria-label="Invite">
        <p class="section-label">Invite code</p>
        <div class="code-box"><span id="room-code"></span><button type="button" class="text-btn" id="copy-code">Copy</button></div>
        <div class="invite-actions">
          <button type="button" class="primary-btn" id="share-invite">Share</button>
          <a class="icon-btn invite-wa" id="share-wa" target="_blank" rel="noopener" aria-label="Share on WhatsApp" title="WhatsApp"></a>
        </div>
      </section>

      <nav class="link-list" aria-label="Room links">
        <a class="link-row" id="room-settings-row" href="room-settings.html" hidden>
          <span>Room settings</span>
          <span class="sheet-chevron" aria-hidden="true"></span>
        </a>
        <a class="link-row" href="activity.html">
          <span>Activity log</span>
          <span class="sheet-chevron" aria-hidden="true"></span>
        </a>
      </nav>

      <section class="member-section" aria-label="Members">
        <h2 class="section-label">Members</h2>
        <div class="list member-list" id="member-list"></div>
      </section>

      <button type="button" class="text-btn is-danger leave-room-btn" id="leave-room">Leave room</button>
    </section>
    <section class="card">
      <h3>Create or join another group</h3>
      <form id="create-form" style="margin-top:12px">
        <label class="field"><span>Group name</span><input type="text" id="new-room-name" maxlength="80" placeholder="e.g. Home, Goa trip" required /></label>
        <label class="field"><span>Type</span>
          <select id="new-room-type" class="select">
            <option value="home">🏠 Home</option>
            <option value="friends">👥 Friends</option>
            <option value="trip">✈️ Trip</option>
            <option value="other">✨ Other</option>
          </select>
        </label>
        <div id="new-room-dates" class="filters" hidden>
          <label class="field"><span>Start</span><input type="date" id="new-room-start" /></label>
          <label class="field"><span>End</span><input type="date" id="new-room-end" /></label>
        </div>
        <button type="submit" class="primary-btn">Create group</button>
      </form>
      <form id="join-form" style="margin-top:16px">
        <label class="field"><span>Invite code</span><input type="text" id="join-code" maxlength="6" placeholder="ABC123" autocapitalize="characters" /></label>
        <button type="submit" class="secondary-btn">Join group</button>
      </form>
      <p class="form-error" id="room-error" hidden></p>
    </section>
  </main>
  <nav id="bottom-nav" class="bottom-nav"></nav>
  <script defer src="config.js"></script>
  <script defer src="vendor/supabase.min.js"></script>
  
  <script defer src="js/common.js"></script>
  <script defer src="js/room.js"></script>
</body>
</html>
