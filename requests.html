<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Accept or decline pending roommate shares." />
  <meta name="theme-color" content="#0E1410" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("monthly-budget-theme");
        if (t !== "light" && t !== "dark") t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        var bg = t === "light" ? "#F4F4F2" : "#0E1410";
        document.documentElement.setAttribute("data-theme", t);
        document.documentElement.style.backgroundColor = bg;
        document.documentElement.style.colorScheme = t;
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", bg);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
        document.documentElement.style.backgroundColor = "#0E1410";
      }
    })();
  </script>
  <meta name="color-scheme" content="dark light" />
  <title>Pending requests · Monthly Budget</title>
  <link rel="icon" href="favicon.svg?v=22" type="image/svg+xml" />
  <link rel="manifest" href="manifest.json?v=31" />
  <link rel="preconnect" href="https://kjnzcetsidsvnrtybicl.supabase.co" crossorigin />
  <link rel="dns-prefetch" href="https://kjnzcetsidsvnrtybicl.supabase.co" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header id="topbar" class="topbar"></header>
  <main class="page" id="main">
    <section class="card">
      <header class="card-head">
        <div>
          <h2>Pending requests</h2>
          <p class="card-sub">Only accepted shares count toward your balance, my share, and settle up. Declined shares stay unallocated unless the person who added the expense edits the split.</p>
        </div>
      </header>
      <div id="pending-list"></div>
    </section>
  </main>
