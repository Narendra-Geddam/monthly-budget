<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Shared roommate expenses for your bachelor room." />
  <meta name="theme-color" content="#0E1410" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("monthly-budget-theme");
        if (t !== "light" && t !== "dark") t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        var bg = t === "light" ? "#F4F4F2" : "#0E1410";
        document.documentElement.setAttribute("data-theme", t);
        document.documentElement.style.backgroundColor = bg;
        document.documentElement.style.colorScheme = t;
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", bg);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
        document.documentElement.style.backgroundColor = "#0E1410";
      }
    })();
  </script>
  <meta name="color-scheme" content="dark light" />
  <title>Sign up · Monthly Budget</title>
  <link rel="icon" href="favicon.svg?v=22" type="image/svg+xml" />
  <link rel="manifest" href="manifest.json?v=37" />
  <link rel="preconnect" href="https://kjnzcetsidsvnrtybicl.supabase.co" crossorigin />
  <link rel="dns-prefetch" href="https://kjnzcetsidsvnrtybicl.supabase.co" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="auth-body">
  <main class="auth-card">
    <div class="auth-brand">
      <img src="favicon.svg?v=22" alt="" width="40" height="40" />
      <div>
        <p class="brand-kicker">Roommate expenses</p>
        <h1>Monthly Budget</h1>
      </div>
    </div>

    <p class="auth-lead">Create an account to share rent, groceries, and bills with your room.</p>
    <p class="form-error" id="config-warning" hidden></p>
    <form id="signup-form">
      <label class="field"><span>Display name</span><input type="text" id="auth-name" required maxlength="40" autocomplete="nickname" placeholder="Your name" /></label>
      <label class="field"><span>Email</span><input type="email" id="auth-email" required autocomplete="email" placeholder="you@example.com" /></label>
      <label class="field"><span>Password</span><input type="password" id="auth-password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters" /></label>
      <p class="pw-hint" id="pw-hint">Use at least 8 characters.</p>
      <label class="field"><span>Confirm password</span><input type="password" id="auth-confirm" required minlength="8" autocomplete="new-password" /></label>
      <p class="pw-match" id="pw-match" hidden></p>
      <p class="form-error" id="auth-error" hidden></p>
      <p class="form-ok" id="auth-ok" hidden></p>
      <button type="submit" class="primary-btn auth-submit" id="auth-submit">Create account</button>
    </form>
    <p class="auth-switch">Already have an account? <a href="login.html" id="auth-switch-link">Log in</a></p>
  </main>
  <script defer src="config.js"></script>
  <script defer src="vendor/supabase.min.js"></script>
  
  <script defer src="js/common.js"></script>
  <script defer src="js/signup.js"></script>
</body>
</html>
