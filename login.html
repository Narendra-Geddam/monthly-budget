<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Shared roommate expenses for your bachelor room." />
  <meta name="theme-color" content="#0E1410" />
  <meta name="color-scheme" content="dark light" />
  <title>Log in · Monthly Budget</title>
  <link rel="icon" href="favicon.svg?v=22" type="image/svg+xml" />
  <link rel="manifest" href="manifest.json?v=30" />
  <link rel="preconnect" href="https://kjnzcetsidsvnrtybicl.supabase.co" crossorigin />
  <link rel="dns-prefetch" href="https://kjnzcetsidsvnrtybicl.supabase.co" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("monthly-budget-theme");
        if (t !== "light" && t !== "dark") t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", t);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", t === "light" ? "#F4F4F2" : "#0E1410");
      } catch (e) { document.documentElement.setAttribute("data-theme", "dark"); }
    })();
  </script>
</head>
<body class="auth-body">
  <main class="auth-card">
    <div class="auth-brand">
      <img src="favicon.svg?v=22" alt="" width="40" height="40" />
      <div>
        <p class="brand-kicker">Roommate expenses</p>
        <h1>Monthly Budget</h1>
      </div>
    </div>

    <p class="auth-lead">Log in to your roommate budget.</p>
    <p class="form-error" id="config-warning" hidden></p>
    <form id="login-form">
      <label class="field"><span>Email</span><input type="email" id="auth-email" required autocomplete="email" placeholder="you@example.com" /></label>
      <label class="field"><span>Password</span><input type="password" id="auth-password" required autocomplete="current-password" /></label>
      <p class="form-error" id="auth-error" hidden></p>
      <p class="form-ok" id="auth-ok" hidden></p>
      <button type="submit" class="primary-btn auth-submit" id="auth-submit">Log in</button>
    </form>
    <p class="auth-extra"><button type="button" class="forgot-link" id="forgot-btn">Forgot password?</button></p>
    <form id="forgot-form" hidden>
      <p class="card-sub">We'll email a reset link using Supabase's built-in mail (there's a low hourly limit). Enter the email on your account.</p>
      <label class="field"><span>Email</span><input type="email" id="forgot-email" autocomplete="email" placeholder="you@example.com" /></label>
      <div class="btn-row">
        <button type="submit" class="primary-btn" id="forgot-submit">Send reset link</button>
        <button type="button" class="secondary-btn" id="forgot-cancel">Back to log in</button>
      </div>
    </form>
    <p class="auth-switch">New here? <a href="signup.html" id="auth-switch-link">Create an account</a></p>
  </main>
  <script defer src="config.js"></script>
  <script defer src="vendor/supabase.min.js"></script>
  
  <script defer src="js/common.js"></script>
  <script defer src="js/login.js"></script>
</body>
</html>
